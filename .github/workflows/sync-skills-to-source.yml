name: Sync skill changes to source repos

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.DISPATCH_TOKEN }}

      - name: Detect changed skills
        id: changed
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- skills/ \
            | cut -d'/' -f2 \
            | sort -u \
            | grep -v '^\.' \
            | tr '\n' ' ' \
            | xargs)

          if [ -z "$CHANGED" ]; then
            echo "No skill folders changed"
            echo "skills=" >> $GITHUB_OUTPUT
          else
            echo "Changed skills: $CHANGED"
            echo "skills=$CHANGED" >> $GITHUB_OUTPUT
          fi

      - name: Sync each changed skill
        if: steps.changed.outputs.skills != ''
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          REPO_NAME: ${{ github.event.repository.name }}
          ORG: ${{ github.repository_owner }}
        run: |
          for SKILL in ${{ steps.changed.outputs.skills }}; do
            echo "=========================================="
            echo "Processing: $SKILL"
            echo "=========================================="

            SKILL_REPO_URL="https://x-access-token:${GH_TOKEN}@github.com/${ORG}/${SKILL}.git"
            SYNC_BRANCH="sync/from-${REPO_NAME}"

            # Check if skill repo exists
            REPO_CHECK=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${ORG}/${SKILL}")

            if [ "$REPO_CHECK" != "200" ]; then
              echo "SKIP: Skill repo ${ORG}/${SKILL} not found (HTTP $REPO_CHECK)"
              continue
            fi

            # Fetch the skill repo so git can resolve squash-merge commits
            echo "Fetching ${ORG}/${SKILL} history..."
            git fetch "$SKILL_REPO_URL" main

            # Split the subtree into a temporary branch
            echo "Splitting subtree for skills/${SKILL}..."
            git subtree split --prefix="skills/${SKILL}" -b "temp-split-${SKILL}"

            # Push the split branch to the skill repo
            echo "Pushing to ${ORG}/${SKILL} branch ${SYNC_BRANCH}..."
            git push "$SKILL_REPO_URL" "temp-split-${SKILL}:refs/heads/${SYNC_BRANCH}" --force

            # Check if a PR already exists
            EXISTING_PR=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${ORG}/${SKILL}/pulls?head=${ORG}:${SYNC_BRANCH}&state=open" \
              | python3 -c "import sys,json; prs=json.load(sys.stdin); print(prs[0]['number'] if prs else '')" 2>/dev/null)

            if [ -n "$EXISTING_PR" ]; then
              echo "PR #${EXISTING_PR} already exists — updated via force push"
            else
              # Create a new PR
              echo "Creating PR in ${ORG}/${SKILL}..."
              PR_RESPONSE=$(curl -s -X POST \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/${ORG}/${SKILL}/pulls" \
                -d "{
                  \"title\": \"Sync changes from ${REPO_NAME}\",
                  \"body\": \"Automated PR: skill changes made in project **${REPO_NAME}**.\n\nThis PR was created automatically by the sync workflow. Please review the changes and merge when ready.\",
                  \"head\": \"${SYNC_BRANCH}\",
                  \"base\": \"main\"
                }")

              NEW_PR=$(echo "$PR_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('number',''))" 2>/dev/null)

              if [ -n "$NEW_PR" ]; then
                echo "Created PR #${NEW_PR} in ${ORG}/${SKILL}"
              else
                echo "WARNING: Failed to create PR. Response:"
                echo "$PR_RESPONSE"
              fi
            fi

            # Clean up local branch
            git branch -D "temp-split-${SKILL}"
            echo "Done: $SKILL"
            echo ""
          done
