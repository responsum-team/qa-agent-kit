name: Update skills manifest

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate skills-manifest.json
        run: |
          SKILLS_DIR="skills"
          REPO_NAME="${{ github.event.repository.name }}"

          echo "{" > skills-manifest.json.tmp
          echo "  \"project\": \"${REPO_NAME}\"," >> skills-manifest.json.tmp
          echo "  \"updated_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"," >> skills-manifest.json.tmp
          echo "  \"skills\": [" >> skills-manifest.json.tmp

          FIRST=true
          for skill_md in "${SKILLS_DIR}"/*/SKILL.md; do
            [ -f "$skill_md" ] || continue
            SKILL_DIR=$(dirname "$skill_md")
            SKILL_NAME=$(basename "$SKILL_DIR")
            SKILL_SOURCE="https://github.com/${{ github.repository_owner }}/${SKILL_NAME}"

            if [ "$FIRST" = true ]; then
              FIRST=false
            else
              echo "    ," >> skills-manifest.json.tmp
            fi

            echo "    {" >> skills-manifest.json.tmp
            echo "      \"name\": \"${SKILL_NAME}\"," >> skills-manifest.json.tmp
            echo "      \"source\": \"${SKILL_SOURCE}\"," >> skills-manifest.json.tmp
            echo "      \"path\": \"${SKILL_DIR}\"" >> skills-manifest.json.tmp
            echo -n "    }" >> skills-manifest.json.tmp
          done

          echo "" >> skills-manifest.json.tmp
          echo "  ]" >> skills-manifest.json.tmp
          echo "}" >> skills-manifest.json.tmp

          mv skills-manifest.json.tmp skills-manifest.json
          cat skills-manifest.json

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills-manifest.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Auto-update skills-manifest.json"
            git push
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger skill-usage-map update
        if: steps.commit.outputs.changed == 'true'
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository_owner }}/shared-workflows/dispatches \
            -d '{"event_type":"update-skill-map","client_payload":{"project":"${{ github.event.repository.name }}"}}'
